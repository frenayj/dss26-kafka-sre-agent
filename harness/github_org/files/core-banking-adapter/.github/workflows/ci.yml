name: ci

on:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test
        run: mvn -B -ntp verify
      - name: Copybooks unchanged without a core change request
        if: github.event.pull_request.base.ref == 'main'
        run: |
          git fetch --depth=1 origin main
          if ! git diff --quiet origin/main -- copybooks/; then
            echo "::warning::copybooks/ changed - link the CORE change request approved by the mainframe team"
          fi
