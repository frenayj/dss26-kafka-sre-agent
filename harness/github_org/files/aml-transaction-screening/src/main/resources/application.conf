aml-screening {
  kafka {
    bootstrap-servers = ${KAFKA_BOOTSTRAP_SERVERS}
    schema-registry-url = ${SCHEMA_REGISTRY_URL}
    # Passed through to every Kafka client as-is.
    client {
      "security.protocol" = "SASL_SSL"
      "security.protocol" = ${?KAFKA_SECURITY_PROTOCOL}
      "sasl.mechanism" = "SCRAM-SHA-512"
      "sasl.jaas.config" = ${?KAFKA_SASL_JAAS_CONFIG}
    }
  }

  # Thresholds signed off by the MLRO; see docs/typologies.md before changing.
  rules {
    large-value-eur = 10000
    round-amount-min-eur = 5000
    structuring {
      band-low-eur = 9000
      band-high-eur = 10000
      count-24h = 3
    }
    high-risk-merchants = []
    high-risk-merchants = ${?AML_HIGH_RISK_MERCHANTS}
  }

  # ECB euro reference rates, units per EUR. Refreshed daily by the deploy job.
  fx.per-eur {
    USD = 1.0812
    GBP = 0.8411
    CHF = 0.9378
    SEK = 11.395
    PLN = 4.2780
  }
}
